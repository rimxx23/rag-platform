name: rag-platform

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  frontend:
    image: caddy:2-alpine
    environment:
      TRUSTED_EDGE_PROXY: ${TRUSTED_EDGE_PROXY:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/public:/srv:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    env_file: .env
    environment: &docker_env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      FASTEMBED_CACHE_PATH: /app/models
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips=*"
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on: &depends
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment: *docker_env
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on: *depends
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  models:
